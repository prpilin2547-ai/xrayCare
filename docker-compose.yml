networks:
  xraycare1:

services:
  api.xraycare:
    container_name: xraycare_api
    build:
      context: .
      dockerfile: api/api.xraycare/Dockerfile
    restart: always
    ports:
      - "8001:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xraycare1
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=postgres;Username=xrayuser;Password=xraycare1234"

  postgres:
    image: postgres:16
    container_name: xraycare_postgres
    restart: always
    environment:
      POSTGRES_USER: xrayuser
      POSTGRES_PASSWORD: xraycare1234
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - xraycare1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xrayuser -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: